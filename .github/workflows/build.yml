name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          ZIP="$(ls *.zip | head -n1)"
          echo "Using $ZIP"
          mkdir -p "$RUNNER_TEMP/proj"
          unzip -q -o "$ZIP" -d "$RUNNER_TEMP/proj"
          F="$(find "$RUNNER_TEMP/proj" -name settings.gradle.kts | head -n1)"
          echo "PROJ=$(dirname "$F")" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Unit tests + assembleDebug
        run: |
          cd "$PROJ"
          gradle testDebugUnitTest assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: subway-controller-debug-apk
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/app-debug.apk
