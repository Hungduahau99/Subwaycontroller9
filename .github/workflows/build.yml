name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SubwayController

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
          build-root-directory: SubwayController

      - name: Unit tests + assembleDebug
        run: gradle testDebugUnitTest assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: subway-controller-debug-apk
          path: SubwayController/app/build/outputs/apk/debug/app-debug.apk
